# Include this snippet inside the existing HTTPS VirtualHost for
# grupolosnietos.com.ar. Keep its current DocumentRoot: /pos is mounted with
# Alias so the rest of the domain remains untouched.

RedirectMatch 301 ^/pos$ /pos/

# These proxy rules do not modify the other API running on port 3001.
ProxyPass        /pos/api/ http://127.0.0.1:3002/api/ retry=0 timeout=60
ProxyPassReverse /pos/api/ http://127.0.0.1:3002/api/

Alias /pos/ /var/www/grupolosnietos/pos/apps/admin/dist/

<Directory /var/www/grupolosnietos/pos/apps/admin/dist>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html

    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /pos/index.html [L]

    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    <Files "sw.js">
        Header set Cache-Control "no-cache"
        Header set Service-Worker-Allowed "/pos/"
    </Files>
</Directory>
