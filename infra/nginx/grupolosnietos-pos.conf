# Include this file inside the existing HTTPS server block for
# grupolosnietos.com.ar. It does not replace the configuration of the other API.

location = /pos {
    return 301 /pos/;
}

# This location must appear before the static /pos/ location.
location /pos/api/ {
    proxy_pass http://127.0.0.1:3002/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_cache_bypass $http_authorization;
    add_header Cache-Control "no-store" always;
}

# Copy apps/admin/dist to /var/www/grupolosnietos/pos before reloading Nginx.
location /pos/ {
    root /var/www/grupolosnietos;
    try_files $uri $uri/ /pos/index.html;
}

# Never keep an obsolete application shell or service worker at the proxy layer.
location = /pos/index.html {
    root /var/www/grupolosnietos;
    add_header Cache-Control "no-cache" always;
}

location = /pos/sw.js {
    root /var/www/grupolosnietos;
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/pos/" always;
}
